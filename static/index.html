<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Finano AI">
<title>Finano AI</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root{--brand:#6366f1;--dark:#0f172a;--card:#1e293b;--accent:#22d3ee}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
body{font-family:'Inter',sans-serif;background:var(--dark);color:#fff}
.glass{background:rgba(30,41,59,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}
.pulse-dot{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fade-in{animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
.btn-brand{background:var(--brand)}.btn-brand:hover{opacity:.85}
</style>
<script>
tailwind.config={theme:{extend:{colors:{
  brand:'var(--brand,#6366f1)',dark:'var(--dark,#0f172a)',
  card:'var(--card,#1e293b)',accent:'var(--accent,#22d3ee)'
}}}}
</script>
</head>
<body class="min-h-screen">

<!-- Login -->
<div id="login" class="min-h-screen flex items-center justify-center px-6 hidden">
  <div class="glass rounded-2xl p-8 w-full max-w-sm">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg font-bold" style="background:var(--brand)">F</div>
      <div><div class="font-semibold">Finano AI</div><div class="text-xs text-gray-400">Panel administracyjny</div></div>
    </div>
    <form onsubmit="doLogin(event)">
      <label class="text-sm text-gray-400">Hasło</label>
      <input type="password" id="login-pass" class="w-full mt-1 mb-4 px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-brand" autofocus>
      <label class="text-sm text-gray-400">Kod 2FA</label>
      <input type="text" id="login-totp" inputmode="numeric" maxlength="6" class="w-full mt-1 mb-4 px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-brand tracking-[0.5em] text-center text-xl" placeholder="000000">
      <div id="login-error" class="text-red-400 text-sm mb-3 hidden"></div>
      <button type="submit" class="w-full py-3 rounded-xl font-medium btn-brand transition">Zaloguj</button>
    </form>
  </div>
</div>

<!-- Landing/Dashboard — dynamic sections -->
<div id="landing" class="min-h-screen flex flex-col">
  <nav id="top-nav" class="flex items-center justify-between px-6 py-4">
    <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='/'">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold" style="background:var(--brand)">F</div>
      <span class="font-semibold text-lg" id="nav-title">Finano AI</span>
    </div>
    <div class="flex items-center gap-2">
      <span id="nav-page" class="text-xs text-gray-500"></span>
      <button onclick="requireAuth()" class="text-sm px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 transition">Admin</button>
    </div>
  </nav>
  <div id="dashboard-layout" class="flex-1 flex w-full">
    <!-- Sidebar (only in dashboard mode with menu) -->
    <aside id="sidebar" class="hidden md:hidden w-60 border-r border-white/5 px-3 py-6 flex-shrink-0"></aside>
    <!-- Main content -->
    <main id="main-content" class="flex-1 px-4 md:px-6 py-6">
      <div id="sections-wrap" class="mx-auto w-full"></div>
    </main>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="min-h-screen hidden">
  <nav class="flex items-center justify-between px-4 py-3 glass sticky top-0 z-50">
    <button onclick="showLanding()" class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold" style="background:var(--brand)">F</div>
      <span class="font-semibold">Dashboard</span>
    </button>
    <div class="flex items-center gap-3">
      <span id="ws-status" class="w-2 h-2 rounded-full bg-gray-500"></span>
      <span class="text-xs text-gray-400" id="ws-label">Łączenie...</span>
      <button onclick="doLogout()" class="text-xs px-3 py-1 rounded-lg bg-white/5 hover:bg-white/10">Wyloguj</button>
    </div>
  </nav>
  <div class="p-4 space-y-4 pb-20 max-w-4xl mx-auto">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="glass rounded-xl p-3"><div class="text-xs text-gray-400">Status</div><div id="d-status" class="text-lg font-bold text-green-400 mt-1">-</div></div>
      <div class="glass rounded-xl p-3"><div class="text-xs text-gray-400">Dziś</div><div id="d-today" class="text-lg font-bold mt-1" style="color:var(--accent)">-</div></div>
      <div class="glass rounded-xl p-3"><div class="text-xs text-gray-400">Błędy</div><div id="d-errors" class="text-lg font-bold text-red-400 mt-1">-</div></div>
      <div class="glass rounded-xl p-3"><div class="text-xs text-gray-400">Koszt ($)</div><div id="d-cost" class="text-lg font-bold text-yellow-400 mt-1">-</div></div>
    </div>
    <div class="glass rounded-xl p-4"><h3 class="text-sm font-semibold text-gray-300 mb-3">Serwisy</h3><div id="d-services" class="space-y-2 text-sm"></div></div>
    <div class="glass rounded-xl p-4">
      <div class="flex items-center justify-between mb-3"><h3 class="text-sm font-semibold text-gray-300">Aktywność</h3><button onclick="refreshActivity()" class="text-xs" style="color:var(--brand)">Odśwież</button></div>
      <div id="d-activity" class="space-y-2 max-h-96 overflow-y-auto text-sm"></div>
    </div>
    <div class="glass rounded-xl p-4">
      <h3 class="text-sm font-semibold text-gray-300 mb-3"><span class="w-2 h-2 bg-red-500 rounded-full inline-block pulse-dot mr-1"></span>Live</h3>
      <div id="d-live" class="space-y-2 max-h-64 overflow-y-auto text-sm"><div class="text-gray-500">Oczekiwanie na zdarzenia...</div></div>
    </div>
  </div>
</div>

const blockRenderers = {
  kpi_row(k,d) {
    const items = d.items || [];
    return '<div class="grid grid-cols-2 md:grid-cols-'+Math.min(items.length,4)+' gap-4 w-full">'+items.map(i=>{
      const colors={primary:'var(--brand)',success:'#22c55e',danger:'#ef4444',warning:'#eab308',accent:'var(--accent)'};
      const c=colors[i.color]||'var(--accent)';
      const trendIcon = i.trend>0 ? icon('arrow-trending-up','w-3 h-3') : icon('arrow-trending-down','w-3 h-3');
      const iconHtml = i.icon ? '<div class="mb-1" style="color:'+c+'">'+iconOrText(i.icon,'w-6 h-6')+'</div>' : '';
      return '<div class="glass rounded-xl p-4 text-center fade-in flex flex-col items-center">'
        +iconHtml
        +(i.trend?'<div class="text-xs flex items-center gap-1 '+(i.trend>0?'text-green-400':'text-red-400')+' mb-1">'+trendIcon+Math.abs(i.trend)+'%</div>':'')
        +'<div class="text-2xl font-bold" style="color:'+c+'">'+(i.pulse?'<span class="pulse-dot">':'')+i.value+(i.pulse?'</span>':'')+'</div>'
        +'<div class="text-xs text-gray-400 mt-1">'+i.label+'</div></div>';
    }).join('')+'</div>';
  },

  chart(k,d) {
    const id='chart_'+k.replace(/\W/g,'_');
    setTimeout(()=>{
      const el=document.getElementById(id);
      if(!el||!window.Chart) return;
      new Chart(el,{type:d.chart_type||'bar',data:d.data||{},
        options:{responsive:true,plugins:{legend:{labels:{color:'#94a3b8'}},title:{display:!!d.title,text:d.title||'',color:'#e2e8f0'}},
        scales:{x:{ticks:{color:'#64748b'},grid:{color:'rgba(255,255,255,.05)'}},y:{ticks:{color:'#64748b'},grid:{color:'rgba(255,255,255,.05)'}}}}});
    },100);
    return '<div class="glass rounded-xl p-4 w-full fade-in"><canvas id="'+id+'" height="200"></canvas></div>';
  },

  table(k,d) {
    const cols=d.columns||[], rows=d.rows||[];
    // Support both: ['Col1','Col2'] AND [{key,label}, {key,label}]
    const colHeaders = cols.map(c => typeof c === 'object' ? (c.label||c.key) : c);
    const colKeys = cols.map(c => typeof c === 'object' ? c.key : null);
    return '<div class="glass rounded-xl p-4 w-full fade-in overflow-x-auto">'
      +(d.title?'<h3 class="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">'+icon('table-cells','w-4 h-4 text-gray-500')+d.title+'</h3>':'')
      +'<table class="w-full text-sm"><thead><tr>'+colHeaders.map(h=>'<th class="text-left p-2 text-gray-400 border-b border-white/5 font-medium">'+h+'</th>').join('')+'</tr></thead>'
      +'<tbody>'+rows.map(r=>{
        let cells;
        if (Array.isArray(r)) cells = r;
        else if (colKeys.some(k=>k)) cells = colKeys.map(k => r[k] !== undefined ? r[k] : '');
        else cells = Object.values(r);
        return '<tr class="hover:bg-white/5 border-b border-white/5">'+cells.map(v=>'<td class="p-2 text-gray-300">'+(v==null?'':v)+'</td>').join('')+'</tr>';
      }).join('')+'</tbody></table></div>';
  },

  timeline(k,d) {
    const items=d.items||[];
    const colors={primary:'var(--brand)',success:'#22c55e',danger:'#ef4444',warning:'#eab308'};
    const colorIcons={primary:'bolt',success:'check-circle',danger:'x-circle',warning:'exclamation-triangle'};
    return '<div class="glass rounded-xl p-4 w-full fade-in">'
      +(d.title?'<h3 class="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">'+icon('clock','w-4 h-4 text-gray-500')+d.title+'</h3>':'')
      +'<div class="space-y-3">'+items.map(i=>{
        const c=colors[i.color]||'var(--accent)';
        const iconName = i.icon && HEROICONS[i.icon] ? i.icon : (colorIcons[i.color] || 'clock');
        const iconHtml = i.icon && !HEROICONS[i.icon] ? i.icon : icon(iconName,'w-4 h-4');
        return '<div class="flex gap-3 items-start"><div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style="background:color-mix(in srgb,'+c+' 20%,transparent);color:'+c+'">'+iconHtml+'</div>'
          +'<div class="flex-1"><div class="text-sm font-medium">'+i.title+'</div><div class="text-xs text-gray-500">'+i.time+'</div>'+(i.description?'<div class="text-xs text-gray-400 mt-1">'+i.description+'</div>':'')+'</div></div>';
      }).join('')+'</div></div>';
  },

  progress(k,d) {
    // Wsparcie dla pojedynczego paska (d.value) ORAZ listy items (d.items)
    const colors={primary:'var(--brand)',success:'#22c55e',danger:'#ef4444',warning:'#eab308'};
    const renderBar = (label, val, color) => {
      const pct=Math.min(100,Math.max(0,val||0));
      const c=colors[color]||'var(--brand)';
      const done = pct>=100 ? icon('check-circle','w-4 h-4 text-green-400') : '';
      return (label?'<div class="flex justify-between items-center text-sm mb-1"><span class="text-gray-300 flex items-center gap-2">'+done+label+'</span><span style="color:'+c+'">'+pct+'%</span></div>':'')
        +'<div class="h-2 rounded-full bg-white/5 mb-3"><div class="h-full rounded-full transition-all" style="width:'+pct+'%;background:'+c+'"></div></div>';
    };
    if (Array.isArray(d.items)) {
      return '<div class="glass rounded-xl p-4 w-full fade-in">'
        +(d.title?'<h3 class="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">'+icon('chart-bar','w-4 h-4 text-gray-500')+d.title+'</h3>':'')
        +d.items.map(i=>renderBar(i.label,i.value,i.color)).join('')
        +'</div>';
    }
    return '<div class="glass rounded-xl p-4 w-full fade-in">'+renderBar(d.title,d.value,d.color)+'</div>';
  },

  markdown(k,d) {
    return '<div class="glass rounded-xl p-4 w-full fade-in">'
      +(d.title?'<h3 class="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">'+icon('document-text','w-4 h-4 text-gray-500')+d.title+'</h3>':'')
      +'<div class="prose prose-invert prose-sm max-w-none">'+(d.content||'').replace(/\n/g,'<br>')+'</div>'
      +'</div>';
  },

  code(k,d) {
    return '<div class="glass rounded-xl p-4 w-full fade-in">'
      +(d.title?'<div class="text-xs text-gray-400 mb-2 flex items-center gap-2">'+icon('code-bracket','w-4 h-4')+d.title+(d.language?' <span class="px-1.5 py-0.5 rounded bg-white/5 text-gray-500">'+d.language+'</span>':'')+'</div>':'')
      +'<pre class="text-xs text-gray-300 overflow-x-auto bg-black/30 rounded-lg p-3"><code>'+((d.content||d.code||'').replace(/</g,'&lt;'))+'</code></pre></div>';
  },

  tabs(k,d) {
    const tabs=d.tabs||[];
    const id='tabs_'+k.replace(/\W/g,'_');
    return '<div class="w-full fade-in" id="'+id+'">'
      +'<div class="flex gap-1 mb-3">'+tabs.map((t,i)=>
        '<button onclick="showTab(\''+id+'\','+i+')" class="px-3 py-1 rounded-lg text-sm '+(i===0?'bg-white/10 text-white':'text-gray-500 hover:text-white')+'" data-tab="'+i+'">'+t.label+'</button>'
      ).join('')+'</div>'
      +tabs.map((t,i)=>'<div class="tab-panel'+(i>0?' hidden':'')+'" data-panel="'+i+'">'+
        (t.blocks||[]).map((b,j)=>renderSection(k+'_tab'+i+'_'+j, typeof b==='string'?b:JSON.stringify(b))).join('')
      +'</div>').join('')+'</div>';
  },

  columns(k,d) {
    const cols=d.columns||[];
    return '<div class="grid grid-cols-1 md:grid-cols-'+cols.length+' gap-4 w-full fade-in">'+cols.map(col=>
      '<div>'+col.map((b,i)=>renderSection(k+'_col_'+i, typeof b==='string'?b:JSON.stringify(b))).join('')+'</div>'
    ).join('')+'</div>';
  },

  form(k,d) {
    const fid = 'form_'+k.replace(/\W/g,'_');
    const fields = (d.fields||[]).map(f => {
      const id = fid+'_'+f.id;
      let input = '';
      if (f.type==='textarea')
        input = '<textarea id="'+id+'" name="'+f.id+'" rows="'+(f.rows||3)+'" placeholder="'+(f.placeholder||'')+'" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-brand resize-y">'+(f.default||'')+'</textarea>';
      else if (f.type==='select')
        input = '<select id="'+id+'" name="'+f.id+'" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-brand">'
          +(f.options||[]).map(o => '<option value="'+(o.value||o)+'" '+(o.value===f.default||o===f.default?'selected':'')+' style="background:#1e293b">'+(o.label||o)+'</option>').join('')+'</select>';
      else if (f.type==='checkbox')
        input = '<label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="'+id+'" name="'+f.id+'" '+(f.default?'checked':'')+' class="w-4 h-4 rounded accent-brand"><span class="text-sm text-gray-300">'+(f.check_label||f.label)+'</span></label>';
      else
        input = '<input type="'+(f.type||'text')+'" id="'+id+'" name="'+f.id+'" value="'+(f.default||'')+'" placeholder="'+(f.placeholder||'')+'" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-white text-sm focus:outline-none focus:border-brand" '+(f.required?'required':'')+'/>';
      return '<div class="space-y-1">'
        +(f.type!=='checkbox'?'<label for="'+id+'" class="text-sm text-gray-400">'+f.label+(f.required?' <span class="text-red-400">*</span>':'')+'</label>':'')
        +input
        +(f.hint?'<div class="text-xs text-gray-500">'+f.hint+'</div>':'')
        +'</div>';
    }).join('');

    return '<div class="glass rounded-xl p-5 w-full fade-in" id="'+fid+'">'
      +(d.title?'<h3 class="text-sm font-semibold text-gray-300 mb-4">'+d.title+'</h3>':'')
      +'<form onsubmit="submitForm(event,this)" data-fid="'+fid+'" data-action="'+d.action+'" data-method="'+(d.method||'POST')+'" data-headers="'+btoa(JSON.stringify(d.headers||{}))+'"><div class="space-y-4">'+fields+'</div>'
      +'<div class="flex items-center gap-3 mt-5">'
      +'<button type="submit" class="px-5 py-2 rounded-lg font-medium text-sm btn-brand transition">'+d.submit_label+'</button>'
      +'<span id="'+fid+'_status" class="text-sm hidden"></span>'
      +'</div></form></div>';
  },
  html(k,d) {
    return '<div class="glass rounded-xl p-4 w-full fade-in">'
      +(d.title?'<h3 class="text-sm font-semibold text-gray-300 mb-3">'+d.title+'</h3>':'')
      +'<div class="html-block">'+d.html+'</div></div>';
  },
  status(k,d) {
    const items = d.items || d;
    if (!Array.isArray(items)) return '';
    return '<div class="glass rounded-xl p-4 w-full fade-in">'
      +(d.title?'<h3 class="text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">'+icon('signal','w-4 h-4 text-gray-500')+d.title+'</h3>':'')
      +renderBadges(k, items)
      +'</div>';
  },
  alert(k,d) { return renderAlert(k, d); },
};

async function submitForm(e, formEl) {
  e.preventDefault();
  const fid = formEl.dataset.fid;
  const action = formEl.dataset.action;
  const method = formEl.dataset.method || 'POST';
  let extraHeaders = {};
  try { extraHeaders = JSON.parse(atob(formEl.dataset.headers || 'e30=')); } catch(e) {}
  const status = document.getElementById(fid+'_status');
  const btn = formEl.querySelector('button[type=submit]');
  const origLabel = btn.textContent;
  const data = {};
  formEl.querySelectorAll('input,select,textarea').forEach(el => {
    if (el.type==='checkbox') data[el.name] = el.checked;
    else if (el.value) data[el.name] = el.type==='number'?Number(el.value):el.value;
  });
  btn.disabled = true; btn.textContent = 'Wysyłanie...';
  if (status) status.classList.add('hidden');
  try {
    const headers = {'Content-Type':'application/json', ...extraHeaders};
    const r = await fetch(action, {method, headers, body: JSON.stringify(data)});
    const d = await r.json();
    if (d.success || r.ok) {
      if (status) { status.textContent = d.message || 'Zapisano!'; status.className = 'text-sm text-green-400'; status.classList.remove('hidden'); }
      formEl.reset();
    } else {
      if (status) { status.textContent = d.error || d.detail || 'Błąd'; status.className = 'text-sm text-red-400'; status.classList.remove('hidden'); }
    }
  } catch(err) {
    if (status) { status.textContent = 'Błąd połączenia'; status.className = 'text-sm text-red-400'; status.classList.remove('hidden'); }
  }
  btn.disabled = false; btn.textContent = origLabel;
  setTimeout(()=>{ if(status) status.classList.add('hidden'); }, 5000);
}

function showTab(containerId, idx) {
  const c=document.getElementById(containerId);
  if(!c)return;
  c.querySelectorAll('[data-tab]').forEach(b=>{b.className=b.className.replace('bg-white/10 text-white','text-gray-500 hover:text-white')});
  c.querySelector('[data-tab="'+idx+'"]').className=c.querySelector('[data-tab="'+idx+'"]').className.replace('text-gray-500 hover:text-white','bg-white/10 text-white');
  c.querySelectorAll('.tab-panel').forEach(p=>p.classList.add('hidden'));
  c.querySelector('[data-panel="'+idx+'"]').classList.remove('hidden');
}

function renderSection(key, val) {
  let p=val; try{p=JSON.parse(val)}catch{}
  if(SYSTEM_KEYS.has(key)) return '';
  if(HERO_KEYS.has(key)) return ''; // handled by hero renderer
  if(key==='hero_buttons') return renderButtons(p);
  if(key==='footer_text') return `<div class="text-center text-xs text-gray-600 w-full">${val}</div>`;
  if(key==='widgets') return ''; // widgets appended to body separately

  // Typed blocks (explicit "type" field)
  if(typeof p==='object'&&p!==null&&p.type&&blockRenderers[p.type]) return blockRenderers[p.type](key,p);

  // Auto-detect type
  if(typeof p==='object'&&p!==null&&p.text&&p.type) return renderAlert(key,p);
  if(Array.isArray(p)&&p.length&&p[0].label&&p[0].value!==undefined) return renderStats(key,p);
  if(Array.isArray(p)&&p.length&&p[0].title&&p[0].description) return renderCards(key,p);
  if(Array.isArray(p)&&p.length&&p[0].name&&p[0].status) return renderBadges(key,p);
  if(Array.isArray(p)&&p.length&&p[0].label&&(p[0].url||p[0].action)) return renderButtons(p);
  if(typeof p==='string'&&p.length>0) return `<div class="glass rounded-xl p-4 w-full fade-in"><h3 class="text-sm font-semibold text-gray-400 mb-2">${key.replace(/_/g,' ')}</h3><p class="text-gray-200">${p}</p></div>`;
  if(typeof p==='object') return renderJson(key,p);
  return '';
}

function renderAlert(k,d){
  const colors={info:'border-blue-500 bg-blue-500/10 text-blue-200',success:'border-green-500 bg-green-500/10 text-green-200',warning:'border-yellow-500 bg-yellow-500/10 text-yellow-200',danger:'border-red-500 bg-red-500/10 text-red-200'};
  const alertType = d.alert_type || d.type || 'info';
  const iconMap = {info:'information-circle', success:'check-circle', warning:'exclamation-triangle', danger:'x-circle'};
  return `<div class="w-full rounded-xl p-4 border-l-4 ${colors[alertType]||colors.info} fade-in flex items-start gap-3">${icon(iconMap[alertType]||'information-circle','w-5 h-5 mt-0.5 flex-shrink-0')}<div class="flex-1">${d.text}</div></div>`;
}

function renderStats(k,items){
  return `<div class="grid grid-cols-2 md:grid-cols-${Math.min(items.length,4)} gap-4 w-full">${items.map(i=>
    `<div class="glass rounded-xl p-4 text-center fade-in"><div class="text-2xl font-bold" style="color:var(--accent)">${i.value}</div><div class="text-xs text-gray-400 mt-1">${i.icon||''} ${i.label}</div></div>`
  ).join('')}</div>`;
}

function renderCards(k,items){
  return `<div class="grid grid-cols-1 md:grid-cols-${Math.min(items.length,3)} gap-4 w-full">${items.map(i=>
    `<div class="glass rounded-xl p-5 fade-in"><div class="text-2xl mb-2">${i.icon||'📋'}</div><h4 class="font-semibold mb-1">${i.title}</h4><p class="text-sm text-gray-400">${i.description}</p></div>`
  ).join('')}</div>`;
}

function renderBadges(k,items){
  const sc={active:'bg-green-500/20 text-green-300',ok:'bg-green-500/20 text-green-300',online:'bg-green-500/20 text-green-300',standby:'bg-yellow-500/20 text-yellow-300',pending:'bg-yellow-500/20 text-yellow-300',warning:'bg-yellow-500/20 text-yellow-300',offline:'bg-red-500/20 text-red-300',error:'bg-red-500/20 text-red-300',failed:'bg-red-500/20 text-red-300'};
  return `<div class="flex flex-wrap gap-2 w-full">${items.map(i=>{
    const stat = (i.status||'').toLowerCase();
    const iconName = STATUS_ICON[stat] || 'information-circle';
    const customIcon = i.icon ? iconOrText(i.icon,'w-4 h-4') : icon(iconName,'w-4 h-4');
    const detail = i.detail ? ` <span class="opacity-60 text-xs">(${i.detail})</span>` : '';
    return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm ${sc[stat]||'bg-gray-500/20 text-gray-300'} fade-in">${customIcon}${i.name}${detail}</span>`;
  }).join('')}</div>`;
}

function renderButtons(items){
  if(!Array.isArray(items)) return '';
  return `<div class="flex gap-3 flex-wrap justify-center w-full">${items.map(b=>{
    const style=b.color?`background:${b.color}`:(b.style==='primary'?'background:var(--brand)':'background:rgba(255,255,255,.05)');
    if(b.action==='dashboard') return `<button onclick="requireAuth()" class="px-6 py-3 rounded-xl font-medium hover:opacity-80 transition" style="${style}">${b.label}</button>`;
    return `<a href="${b.url||'#'}" target="_blank" class="px-6 py-3 rounded-xl font-medium hover:opacity-80 transition" style="${style}">${b.label}</a>`;
  }).join('')}</div>`;
}

function renderJson(k,d){
  return `<div class="glass rounded-xl p-4 w-full fade-in"><h3 class="text-sm font-semibold text-gray-400 mb-2">${k.replace(/_/g,' ')}</h3><pre class="text-xs text-gray-300 overflow-x-auto">${JSON.stringify(d,null,2)}</pre></div>`;
}

function renderHero(c){
  return `<div class="text-center w-full fade-in">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-sm mb-6" style="background:color-mix(in srgb,var(--brand) 15%,transparent);color:var(--brand)">
      <span class="w-2 h-2 bg-green-400 rounded-full pulse-dot"></span><span>Online</span></div>
    <h1 class="text-4xl md:text-6xl font-bold mb-4 leading-tight">${c.hero_title||'Finano AI'}<br><span style="color:var(--brand)">${c.hero_highlight||''}</span></h1>
    <p class="text-gray-400 text-lg md:text-xl max-w-xl mx-auto mb-8">${c.hero_description||''}</p>
  </div>`;
}

// ── Build page from content ──
// Default column span per block type (12-col grid)
const COL_SPAN = {
  alert: 12, kpi_row: 12, table: 12, tabs: 12, columns: 12, html: 12, hero: 12,
  chart: 8, markdown: 6, code: 6, form: 6, status: 6, progress: 6, timeline: 4,
};
function blockColSpan(type, dataCols) {
  if (dataCols && dataCols >= 1 && dataCols <= 12) return dataCols;
  return COL_SPAN[type] || 6;
}
function wrapInGrid(html, span) {
  if (!html) return '';
  return '<div class="col-span-12 md:col-span-'+span+'">'+html+'</div>';
}
function isDashboardMode() {
  return currentPage !== 'main';
}

function buildPage(c) {
  const dashboard = isDashboardMode();

  // Apply _config overrides
  let cfg = {};
  if(c._config) {
    try {
      cfg = typeof c._config === 'string' ? JSON.parse(c._config) : c._config;
      if(cfg.theme_brand) document.documentElement.style.setProperty('--brand', cfg.theme_brand);
      if(cfg.theme_accent) document.documentElement.style.setProperty('--accent', cfg.theme_accent);
      if(cfg.theme_dark) document.documentElement.style.setProperty('--dark', cfg.theme_dark);
      if(cfg.title) document.title = cfg.title;
    } catch(e) {}
  }

  // Apply theme
  if(c.theme_brand) document.documentElement.style.setProperty('--brand',c.theme_brand);
  if(c.theme_accent) document.documentElement.style.setProperty('--accent',c.theme_accent);
  if(c.theme_dark) document.documentElement.style.setProperty('--dark',c.theme_dark);
  if(c.meta_description) document.querySelector('meta[name=description]').content=c.meta_description;

  // Update top-nav title
  const navTitle = document.getElementById('nav-title');
  const navPage = document.getElementById('nav-page');
  if (navTitle) navTitle.textContent = dashboard ? (cfg.title || currentPage) : 'Finano AI';
  if (navPage) navPage.textContent = dashboard ? '/'+currentPage : '';

  // Widgets (append to body)
  document.querySelectorAll('elevenlabs-convai').forEach(e=>e.remove());
  if(c.widgets) try{const ws=JSON.parse(c.widgets);ws.filter(w=>w.type==='elevenlabs'&&w.enabled).forEach(w=>{
    const el=document.createElement('elevenlabs-convai');el.setAttribute('agent-id',w.agent_id);document.body.appendChild(el)})}catch{}

  // Adjust container width: dashboard = full-width, landing = narrow centered
  const wrap = document.getElementById('sections-wrap');
  if (wrap) {
    wrap.className = dashboard
      ? 'mx-auto w-full max-w-[1600px]'
      : 'flex flex-col items-center gap-8 max-w-4xl mx-auto w-full';
  }

  // Sidebar (only dashboard mode with _menu)
  const sidebar = document.getElementById('sidebar');
  let hasSidebar = false;
  if (sidebar) {
    sidebar.innerHTML = '';
    sidebar.className = 'hidden md:hidden w-60 border-r border-white/5 px-3 py-6 flex-shrink-0';
    if (dashboard && c._menu) {
      try {
        const menu = typeof c._menu === 'string' ? JSON.parse(c._menu) : c._menu;
        if (Array.isArray(menu) && menu.length) {
          hasSidebar = true;
          sidebar.className = 'hidden md:flex flex-col w-60 border-r border-white/5 px-3 py-6 flex-shrink-0 sticky top-0 h-screen overflow-y-auto';
          sidebar.innerHTML = '<div class="text-xs text-gray-500 uppercase tracking-wider px-3 mb-3">Menu</div>'
            + menu.map(m=>{
              const active = window._currentView===m.view;
              const iconHtml = m.icon ? iconOrText(m.icon, 'w-4 h-4') : '';
              return '<button onclick="switchView(\''+m.view+'\',this)" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm transition mb-1 '
                +(active?'text-white':'text-gray-400 hover:text-white hover:bg-white/5')
                +'" style="'+(active?'background:var(--brand)':'')+'">'
                +iconHtml+'<span>'+m.label+'</span></button>';
            }).join('');
        }
      } catch(e) {}
    }
  }

  // Get section order
  let order=[...SECTION_ORDER];
  if(c._section_order) try{order=JSON.parse(c._section_order)}catch{}
  const allKeys=Object.keys(c).filter(k=>!SYSTEM_KEYS.has(k)&&!HERO_KEYS.has(k));
  const extra=allKeys.filter(k=>!order.includes(k)&&k!=='widgets');
  const finalOrder=[...order,...extra];
  const currentView = window._currentView || null;

  // ── Landing mode (page_id=main): keep narrow vertical layout
  if (!dashboard) {
    let menuHtml = '';
    if (c._menu) {
      try {
        const menu = typeof c._menu === 'string' ? JSON.parse(c._menu) : c._menu;
        if (Array.isArray(menu) && menu.length) {
          menuHtml = '<nav class="flex gap-2 flex-wrap justify-center w-full mb-6 py-3 border-b border-white/5">'+menu.map(m=>
            '<button onclick="switchView(\''+m.view+'\',this)" class="px-4 py-2 rounded-xl text-sm transition '+
            (window._currentView===m.view?'text-white':'text-gray-400 hover:text-white bg-white/5 hover:bg-white/10')+
            '" style="'+(window._currentView===m.view?'background:var(--brand)':'')+'">'+(m.icon?iconOrText(m.icon,'w-4 h-4 inline')+' ':'')+m.label+'</button>'
          ).join('')+'</nav>';
        }
      } catch(e) {}
    }
    let html = renderHero(c) + menuHtml;
    for (const key of finalOrder) {
      if (key.includes('__') && currentView) {
        if (key.split('__')[0] !== currentView) continue;
      } else if (currentView && key.includes('__')) continue;
      if (!c[key]) continue;
      html += renderSection(key, c[key]);
    }
    wrap.innerHTML = html;
    return;
  }

  // ── Dashboard mode (page_id != main): grid layout
  let header = '';
  if (cfg.title || cfg.description) {
    header = '<div class="mb-6">'
      + (cfg.title ? '<h1 class="text-2xl md:text-3xl font-bold text-white">'+cfg.title+'</h1>' : '')
      + (cfg.description ? '<p class="text-gray-400 mt-1">'+cfg.description+'</p>' : '')
      + '</div>';
  }

  let gridItems = '';
  for (const key of finalOrder) {
    if (key.includes('__') && currentView) {
      if (key.split('__')[0] !== currentView) continue;
    } else if (currentView && key.includes('__')) continue;
    if (!c[key]) continue;

    // Determine block type & cols
    let parsed = c[key];
    let type = null, dataCols = null;
    try {
      if (typeof parsed === 'string') parsed = JSON.parse(parsed);
      if (parsed && typeof parsed === 'object') {
        type = parsed.type || null;
        dataCols = parsed.cols || null;
      }
    } catch {}
    const span = blockColSpan(type, dataCols);
    const inner = renderSection(key, c[key]);
    if (inner) gridItems += wrapInGrid(inner, span);
  }

  wrap.innerHTML = header + '<div class="grid grid-cols-12 gap-4">' + gridItems + '</div>';
}

// ── CMS update via WebSocket (targeted) ──
function applyCMSUpdate(d) {
  if(!d.key||d.value===undefined) return;
  content[d.key]=d.value;

  // Theme — just update CSS var
  if(d.key.startsWith('theme_')){
    const prop='--'+d.key.replace('theme_','');
    document.documentElement.style.setProperty(prop,d.value);
    return;
  }
  if(d.key==='meta_description'){document.querySelector('meta[name=description]').content=d.value;return}

  // Rebuild page (fast — just innerHTML swap, widgets preserved)
  buildPage(content);
}

// ── Init ──
let _loginReturn=null;
function showLoginGate(){document.getElementById('landing').classList.add('hidden');document.getElementById('dashboard').classList.add('hidden');const lg=document.getElementById('login');if(lg)lg.classList.remove('hidden');const p=document.getElementById('login-pass');if(p)p.focus();}
async function loadCMS(){
  let r; try{ r=await fetch(API+'/api/site/content?page_id='+currentPage,{headers:h()}); }catch{ return; }
  if(r.status===401){ // private dashboard — show the login window (like dash.finano.ai)
    _loginReturn=()=>{document.getElementById('login').classList.add('hidden');document.getElementById('landing').classList.remove('hidden');loadCMS();};
    showLoginGate(); return;
  }
  const c=await r.json().catch(()=>null); if(!c)return;
  Object.assign(content,c);buildPage(content);resolvePullBlocks();
}
async function loadStats(){const d=await f('/api/site/public-stats');if(!d)return;
  // If stats section doesn't exist yet — we'll get them from buildPage
  const el=document.getElementById('stat-msgs');if(el)el.textContent=d.messages_today||0}

window._currentView = null;
function switchView(view, btn) {
  window._currentView = window._currentView === view ? null : view;
  // Update button styles
  document.querySelectorAll('[onclick^="switchView"]').forEach(b=>b.className=b.className.replace('bg-white/10','bg-white/5'));
  if(window._currentView && btn) btn.className=btn.className.replace('bg-white/5','bg-white/10');
  buildPage(content);
}

// ── Pull-mode blocks: resolve data source client-side ──
// Only authenticated (password) viewers succeed; public viewers get 401 and the block
// stays on its seed value. Enforced server-side — the panel just reflects the outcome.
function getPath(obj, path){ if(path==null) return undefined;
  return String(path).split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }

function applyPullResult(key, blk, result){
  if(blk.type==='kpi_row' && Array.isArray(blk.items)){
    blk.items = blk.items.map(it => it.field!==undefined ? {...it, value: String(getPath(result, it.field) ?? it.value)} : it);
  } else if((blk.type==='status'||blk.type==='progress') && Array.isArray(blk.items)){
    blk.items = blk.items.map(it => it.field!==undefined ? {...it, value: getPath(result, it.field) ?? it.value} : it);
  } else if(['markdown','alert','html','code'].includes(blk.type)){
    for(const fld of ['text','content','html','code']) if(typeof blk[fld]==='string')
      blk[fld] = blk[fld].replace(/\{\{([\w.]+)\}\}/g, (m,p)=>{ const v=getPath(result,p); return v==null?'':String(v); });
  } else if(blk.type==='table' && blk.source && blk.source.rows_from){
    const rows=getPath(result, blk.source.rows_from); if(Array.isArray(rows)) blk.rows=rows;
  }
  blk._pull={ok:true, at:Date.now()};
  content[key]=blk;
}

let _pullStatus={total:0, ok:0, denied:0, error:0};
let _pullBusy=false;
async function resolvePullBlocks(){
  if(_pullBusy) return; _pullBusy=true;
  const st={total:0, ok:0, denied:0, error:0}; let changed=false;
  try{
    for(const key of Object.keys(content)){
      let blk=content[key];
      try{ if(typeof blk==='string') blk=JSON.parse(blk); }catch{ continue; }
      if(!blk || typeof blk!=='object' || !blk.source || blk.source.mode!=='pull' || !blk.source.tool) continue;
      st.total++;
      try{
        const r=await fetch(API+'/api/site/resolve',{method:'POST',
          headers:{'Content-Type':'application/json', ...h()},
          body:JSON.stringify({tool:blk.source.tool, input:blk.source.input||{}})});
        if(r.status===401){ st.denied++; blk._pull={ok:false,state:'auth'}; content[key]=blk; continue; }
        if(r.status===403){ st.denied++; blk._pull={ok:false,state:'forbidden'}; content[key]=blk; continue; }
        const j=await r.json().catch(()=>null);
        if(!j || j.ok!==true){ st.error++; blk._pull={ok:false,state:'error',msg:(j&&j.error)||('HTTP '+r.status)}; content[key]=blk; continue; }
        applyPullResult(key, blk, j.result); st.ok++; changed=true;
      }catch(e){ st.error++; blk._pull={ok:false,state:'error',msg:String(e)}; content[key]=blk; }
    }
  } finally { _pullBusy=false; }
  _pullStatus=st;
  if(changed) buildPage(content);
  updateHealthBadge();
}

// ── WS-health + pull-status badge — a frozen panel must never look healthy ──
let lastWsMsg=Date.now();
function wsConnected(){ return (publicWS&&publicWS.readyState===1) || (ws&&ws.readyState===1); }
function updateHealthBadge(){
  let el=document.getElementById('ws-health');
  if(!el){ el=document.createElement('div'); el.id='ws-health';
    el.style.cssText='position:fixed;bottom:10px;right:12px;z-index:60;font-size:11px;padding:5px 9px;'
      +'border-radius:8px;font-family:system-ui,sans-serif;backdrop-filter:blur(6px);'
      +'border:1px solid rgba(255,255,255,.12);pointer-events:none';
    document.body.appendChild(el); }
  const conn=wsConnected(); const age=Math.round((Date.now()-lastWsMsg)/1000); const stale=!conn||age>25;
  const p=_pullStatus;
  const pullTxt = p.total ? ` · pull ${p.ok}/${p.total}${p.denied?` (${p.denied} zablok.)`:''}${p.error?` (${p.error} błąd)`:''}` : '';
  el.style.background = stale ? 'rgba(180,30,30,.85)' : 'rgba(20,50,30,.8)';
  el.style.color = stale ? '#fff' : '#bbf7d0';
  el.textContent = (conn ? (stale?'⚠ WS cichy':'● live') : '⚠ WS rozłączony') + ` · sygnał ${age}s temu` + pullTxt;
}
setInterval(updateHealthBadge, 3000);

loadCMS();

// ── Public WebSocket ──
function connectPublicWS(){
  const url=`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/public?page_id=${currentPage}`;
  publicWS=new WebSocket(url);
  publicWS.onmessage=e=>{lastWsMsg=Date.now();try{const msg=JSON.parse(e.data);
    if(msg.type==='ping'){updateHealthBadge();return;}
    if(msg.type==='cms_update'&&msg.data){applyCMSUpdate(msg.data);}
    else{ resolvePullBlocks(); }   // event-driven: refresh pull blocks on live data events
    updateHealthBadge();
  }catch{}};
  publicWS.onopen=()=>{lastWsMsg=Date.now();updateHealthBadge();};
  publicWS.onclose=()=>{updateHealthBadge();setTimeout(connectPublicWS,5000);};
}
connectPublicWS();

// ── Auth ──
function requireAuth(){if(authToken){showDashboard();return}
  document.getElementById('landing').classList.add('hidden');document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');document.getElementById('login-pass').focus()}
async function doLogin(e){e.preventDefault();
  const r=await f('/api/site/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:document.getElementById('login-pass').value,totp_code:document.getElementById('login-totp').value})});
  if(r?.token){authToken=r.token;localStorage.setItem('finano_token',authToken);
    document.getElementById('login').classList.add('hidden');
    if(_loginReturn){const cb=_loginReturn;_loginReturn=null;cb();}else{showDashboard();}}
  else{const el=document.getElementById('login-error');el.textContent=r?.error||'Błąd';el.classList.remove('hidden')}}
function doLogout(){authToken=null;localStorage.removeItem('finano_token');if(ws)ws.close();
  document.getElementById('dashboard').classList.add('hidden');document.getElementById('login').classList.add('hidden');document.getElementById('landing').classList.remove('hidden')}

// ── Dashboard ──
function showDashboard(){document.getElementById('landing').classList.add('hidden');document.getElementById('login').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');refreshDashboard();connectWS()}
function showLanding(){document.getElementById('dashboard').classList.add('hidden');document.getElementById('landing').classList.remove('hidden');if(ws)ws.close()}

async function refreshDashboard(){
  const d=await f('/api/site/dashboard-stats',{headers:h()});if(!d||d.error)return;
  document.getElementById('d-status').textContent=d.health?.rc_connected?'Online':'Offline';
  document.getElementById('d-status').className=`text-lg font-bold mt-1 ${d.health?.rc_connected?'text-green-400':'text-red-400'}`;
  document.getElementById('d-today').textContent=d.today?.messages||0;
  document.getElementById('d-errors').textContent=d.today?.errors||0;
  document.getElementById('d-cost').textContent=(d.today?.cost_usd||0).toFixed(4);
  const svc=await f('/api/site/dashboard-services',{headers:h()});
  if(svc?.services)document.getElementById('d-services').innerHTML=svc.services.map(s=>
    `<div class="flex items-center justify-between p-2 rounded-lg bg-white/5"><div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full ${s.enabled&&s.healthy?'bg-green-400':'bg-red-400'}"></span><span>${s.display_name||s.name}</span></div><span class="text-gray-400">${s.tools_count} tools</span></div>`).join('');
  refreshActivity()}
async function refreshActivity(){const d=await f('/api/site/dashboard-activity?limit=20',{headers:h()});if(!d?.activity)return;
  document.getElementById('d-activity').innerHTML=d.activity.map(a=>
    `<div class="p-2 rounded-lg bg-white/5 fade-in"><div class="flex items-center justify-between"><span class="font-medium" style="color:var(--brand)">@${a.user}</span><span class="text-xs text-gray-500">${a.ts?new Date(a.ts).toLocaleTimeString('pl'):''}</span></div><div class="text-gray-300 mt-1">${a.question||'-'}</div><div class="flex gap-3 mt-1 text-xs text-gray-500">${a.response_ms?a.response_ms+'ms ':''}${a.tokens?a.tokens+' tok ':''}${a.tools_selected?a.tools_selected+' tools':''}${a.error?'<span class="text-red-400">'+a.error.substring(0,40)+'</span>':''}</div></div>`
  ).join('')||'<div class="text-gray-500">Brak aktywności</div>'}
function handleLiveEvent(msg){const t=msg.type,d=msg.data||{};
  const todayEl=document.getElementById('d-today');if(todayEl&&t==='message')todayEl.textContent=parseInt(todayEl.textContent||0)+1;
  const errEl=document.getElementById('d-errors');if(errEl&&t==='error')errEl.textContent=parseInt(errEl.textContent||0)+1;
  const act=document.getElementById('d-activity');if(act){const el=document.createElement('div');el.className='p-2 rounded-lg bg-white/5 fade-in';
    el.innerHTML=`<div class="flex items-center justify-between"><span class="font-medium" style="color:var(--brand)">@${d.user||'?'}</span><span class="text-xs text-gray-500">${new Date().toLocaleTimeString('pl')}</span></div><div class="text-gray-300 mt-1">${d.question||d.error||'-'}</div>`;
    act.prepend(el);if(act.children.length>30)act.lastChild.remove()}}

function connectWS(){if(ws&&ws.readyState<=1)return;
  ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws/live?token=${authToken}`);
  ws.onopen=()=>{document.getElementById('ws-status').className='w-2 h-2 rounded-full bg-green-400';document.getElementById('ws-label').textContent='Live'};
  ws.onclose=()=>{document.getElementById('ws-status').className='w-2 h-2 rounded-full bg-gray-500';document.getElementById('ws-label').textContent='Ponowne łączenie...';setTimeout(connectWS,3000)};
  ws.onmessage=e=>{lastWsMsg=Date.now();try{const msg=JSON.parse(e.data);if(msg.type==='ping'){updateHealthBadge();return;}
    if(msg.type==='cms_update'&&msg.data){applyCMSUpdate(msg.data);updateHealthBadge();return}
    else{ resolvePullBlocks(); }   // event-driven refresh of pull blocks
    if(['message','tool_call','error'].includes(msg.type))handleLiveEvent(msg);
    const feed=document.getElementById('d-live'),el=document.createElement('div');
    el.className='p-2 rounded-lg fade-in';el.style.background='color-mix(in srgb,var(--brand) 10%,transparent)';
    el.innerHTML=`<span class="text-xs text-gray-400">${new Date(msg.ts*1000).toLocaleTimeString('pl')}</span><span class="ml-2" style="color:var(--brand)">${msg.type}</span><div class="text-xs text-gray-300 mt-1">${JSON.stringify(msg.data).substring(0,120)}</div>`;
    feed.prepend(el);if(feed.children.length>50)feed.lastChild.remove()}catch{}}}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
